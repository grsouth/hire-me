<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lighting Design Portfolio</title>
    <style>
      @import url("https://fonts.bunny.net/css?family=space-grotesk:400,500,600,700|fantasque-sans-mono:400,700");
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background:
          radial-gradient(120% 120% at 20% 12%, rgba(140, 59, 74, 0.06), transparent 45%),
          radial-gradient(140% 140% at 82% 0%, rgba(75, 109, 142, 0.05), transparent 52%),
          linear-gradient(180deg, #111827, #0d1426 60%, #0a0f1d);
        color: #e5e7eb;
        font-family: "Space Grotesk", "Fantasque Sans Mono", "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 20px 84px;
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 11px;
        color: #94a3b8;
        font-weight: 700;
        margin: 0 0 12px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(36px, 5vw, 54px);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #f7d3da;
      }
      .lede {
        margin: 0 0 26px;
        font-size: 18px;
        line-height: 1.7;
        color: #cbd5e1;
      }
      .gallery {
        column-count: 2;
        column-gap: 26px;
      }
      .shot {
        border: 1px solid rgba(39, 52, 73, 0.9);
        border-radius: 16px;
        overflow: hidden;
        background: rgba(15, 23, 42, 0.6);
        box-shadow: 0 18px 38px -28px rgba(0, 0, 0, 0.7);
        display: inline-block;
        width: 100%;
        margin: 0 0 22px;
        break-inside: avoid;
      }
      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }
      @media (max-width: 900px) {
        .gallery {
          column-count: 1;
        }
      }
      .link {
        display: inline-flex;
        margin-top: 32px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(140, 59, 74, 0.55);
        color: #f2d7dc;
        text-decoration: none;
        background: rgba(140, 59, 74, 0.3);
      }
      .link-top {
        margin-bottom: 26px;
      }
      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(7, 10, 20, 0.92);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 100;
      }
      .lightbox.is-open {
        opacity: 1;
        pointer-events: auto;
      }
      .lightbox img {
        max-width: min(1400px, 95vw);
        max-height: 92vh;
        width: auto;
        height: auto;
        border-radius: 16px;
        border: 1px solid rgba(39, 52, 73, 0.9);
        box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.85);
      }
      .lightbox-hint {
        position: fixed;
        bottom: 22px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(203, 213, 225, 0.8);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="link link-top" href="/">Back to the main page</a>
      <h1>Lighting Design Work</h1>
      <section class="gallery" id="gallery"></section>
      <a class="link" href="/">Back to the main page</a>
    </main>
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <img id="lightbox-img" alt="Full resolution lighting design photo" />
      <div class="lightbox-hint">Tap or press Esc to close</div>
    </div>

    <script>
      const gallery = document.getElementById("gallery");
      const base = "/light_design_pics/";
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightbox-img");

      const openLightbox = (src) => {
        lightboxImg.src = src;
        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      };

      const closeLightbox = () => {
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      };

      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeLightbox();
      });

      const shuffle = (items) => {
        for (let i = items.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
        return items;
      };

      const renderGallery = (files) => {
        gallery.innerHTML = "";
        shuffle([...files]).forEach((file) => {
          const card = document.createElement("article");
          card.className = "shot";

          const img = document.createElement("img");
          img.src = `${base}${encodeURIComponent(file)}`;
          img.alt = "Lighting design photo";
          img.loading = "lazy";
          img.style.cursor = "zoom-in";
          img.addEventListener("click", () => openLightbox(img.src));

          card.appendChild(img);
          gallery.appendChild(card);
        });
      };

      fetch(`${base}manifest.json`)
        .then((response) => {
          if (!response.ok) throw new Error("Failed to load manifest");
          return response.json();
        })
        .then((files) => {
          if (!Array.isArray(files)) throw new Error("Invalid manifest");
          renderGallery(files);
        })
        .catch(() => {
          gallery.innerHTML =
            "<p class=\"lede\">Unable to load the lighting design archive.</p>";
        });
    </script>
  </body>
</html>
