<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku Solver Language Comparison</title>
    <style>
      @import url("https://fonts.bunny.net/css?family=space-grotesk:400,500,600,700");
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: linear-gradient(180deg, #0d1426, #0a0f1d 70%);
        color: #e5e7eb;
        font-family: "Space Grotesk", "Fantasque Sans Mono", "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        position: relative;
        min-height: 100vh;
        overflow-x: hidden;
      }
      .page {
        max-width: 880px;
        margin: 0 auto;
        padding: 48px 20px 84px;
        position: relative;
        z-index: 2;
      }
      .tilde-bg {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }
      .tilde-bg pre {
        position: absolute;
        inset: -15%;
        font-family: "Fantasque Sans Mono", "Space Mono", ui-monospace, monospace;
        font-size: 14px;
        line-height: 14px;
        letter-spacing: 0.22em;
        white-space: pre;
        color: transparent;
        background: linear-gradient(110deg, rgba(148, 163, 184, 0.12), rgba(56, 189, 248, 0.1), rgba(251, 191, 36, 0.08), rgba(248, 113, 113, 0.06));
        background-size: 200% 200%;
        background-position: 0% 50%;
        -webkit-background-clip: text;
        background-clip: text;
        text-shadow: 0 0 12px rgba(148, 163, 184, 0.12);
        animation: tide 44s ease-in-out infinite;
      }
      @keyframes tide {
        0% {
          transform: translate3d(-1.5%, -1%, 0);
        }
        50% {
          transform: translate3d(1.5%, 2%, 0);
        }
        100% {
          transform: translate3d(-1.5%, -1%, 0);
        }
      }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 11px;
        color: #94a3b8;
        font-weight: 700;
        margin: 0 0 12px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(36px, 6vw, 54px);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #f7d3da;
      }
      .lede {
        margin: 0 0 22px;
        font-size: 19px;
        line-height: 1.7;
        color: #cbd5e1;
      }
      .md-content {
        margin-top: 28px;
        padding: 26px 28px;
        border-radius: 18px;
        border: 1px solid rgba(39, 52, 73, 0.9);
        background:
          radial-gradient(circle at top left, rgba(140, 59, 74, 0.08), transparent 45%),
          rgba(15, 23, 42, 0.72);
      }
      .md-content h2,
      .md-content h3,
      .md-content h4,
      .md-content h5 {
        margin: 22px 0 10px;
        color: #f3e7ea;
      }
      .md-content h2 {
        margin-top: 34px;
        padding-top: 18px;
        font-size: 24px;
        font-weight: 800;
        color: #f7d3da;
        border-top: 1px solid rgba(140, 59, 74, 0.25);
      }
      .md-content h2:first-of-type {
        margin-top: 8px;
        padding-top: 0;
        border-top: none;
      }
      .md-content h3 {
        margin-top: 26px;
        font-size: 19px;
        font-weight: 800;
        color: #f2b6c4;
      }
      .md-content h4,
      .md-content h5 {
        margin-top: 20px;
        font-size: 16px;
        color: #f1a3b4;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .md-content p,
      .md-content li {
        line-height: 1.8;
        color: #d6deea;
      }
      .md-content p {
        margin: 0 0 16px;
      }
      .md-content p:first-of-type {
        font-size: 18px;
        color: #e5e7eb;
      }
      .md-content ul,
      .md-content ol {
        margin: 0 0 18px;
        padding-left: 24px;
      }
      .md-content li + li {
        margin-top: 6px;
      }
      .md-content a {
        color: #f2d7dc;
        text-decoration: underline;
        text-decoration-color: rgba(140, 59, 74, 0.55);
      }
      .md-content img {
        display: block;
        width: min(100%, 760px);
        height: auto;
        margin: 22px auto;
        border-radius: 14px;
        border: 1px solid rgba(39, 52, 73, 0.9);
        box-shadow: 0 22px 50px -34px rgba(0, 0, 0, 0.85);
      }
      .md-content code {
        font-family: "Fantasque Sans Mono", "Space Mono", ui-monospace, monospace;
        font-size: 0.95em;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(39, 52, 73, 0.9);
        border-radius: 8px;
        padding: 0.12em 0.4em;
      }
      .md-content pre {
        overflow-x: auto;
        margin: 18px 0 24px;
        padding: 16px 18px;
        border-radius: 14px;
        border: 1px solid rgba(39, 52, 73, 0.9);
        background: rgba(8, 12, 24, 0.95);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }
      .md-content pre code {
        display: block;
        padding: 0;
        border: 0;
        background: transparent;
        border-radius: 0;
        white-space: pre;
      }
      .md-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 18px 0 26px;
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid rgba(39, 52, 73, 0.9);
        background: rgba(9, 13, 25, 0.84);
      }
      .md-content th,
      .md-content td {
        padding: 12px 14px;
        border-bottom: 1px solid rgba(39, 52, 73, 0.9);
        text-align: left;
      }
      .md-content th {
        color: #f3e7ea;
        background: rgba(140, 59, 74, 0.18);
      }
      .md-content tr:last-child td {
        border-bottom: 0;
      }
      .md-content del {
        color: #94a3b8;
      }
      .link {
        display: inline-flex;
        margin-top: 26px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(140, 59, 74, 0.55);
        color: #f2d7dc;
        text-decoration: none;
        background: rgba(140, 59, 74, 0.3);
      }
      .link-top {
        margin-bottom: 28px;
      }
      .error {
        margin-top: 18px;
        color: #fca5a5;
      }
      @media (min-width: 900px) {
        .md-content {
          padding: 34px 42px;
        }
        .md-content p,
        .md-content li,
        .md-content td,
        .md-content th {
          font-size: 17px;
        }
      }
    </style>
    <link rel="stylesheet" href="../project-page.css" />
  </head>
  <body>
    <main class="page">
      <a class="link link-top" href="/">Back to the main page</a>
      <p class="eyebrow">Language comparison notes</p>
      <h1 id="page-title">Sudoku Solver Language Comparison</h1>
      <section class="md-content" id="md-content"></section>
      <a class="link" href="/">Back to the main page</a>
    </main>

    <script>
      const content = document.getElementById("md-content");
      const pageTitle = document.getElementById("page-title");

      const escapeHtml = (value) =>
        value
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");

      const parseTableCells = (line) =>
        line
          .trim()
          .replace(/^\|/, "")
          .replace(/\|$/, "")
          .split("|")
          .map((cell) => cell.trim());

      const renderInline = (value) => {
        let text = escapeHtml(value);
        text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
        text = text.replace(/!\[([^\]]*)]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy" />');
        text = text.replace(/\[([^\]]+)]\(([^)]+)\)/g, '<a href="$2">$1</a>');
        text = text.replace(/~~([^~]+)~~/g, "<del>$1</del>");
        text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
        return text;
      };

      const buildHtml = (markdown) => {
        const lines = markdown.split(/\r?\n/);
        const blocks = [];
        let paragraph = [];
        let listItems = [];
        let listType = null;
        let codeFence = null;
        let codeLines = [];

        const flushParagraph = () => {
          if (!paragraph.length) return;
          blocks.push(`<p>${renderInline(paragraph.join(" "))}</p>`);
          paragraph = [];
        };

        const flushList = () => {
          if (!listItems.length || !listType) return;
          const tag = listType === "ol" ? "ol" : "ul";
          blocks.push(`<${tag}>${listItems.map((item) => `<li>${renderInline(item)}</li>`).join("")}</${tag}>`);
          listItems = [];
          listType = null;
        };

        const flushCode = () => {
          if (!codeFence) return;
          blocks.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
          codeFence = null;
          codeLines = [];
        };

        for (let i = 0; i < lines.length; i += 1) {
          const line = lines[i];

          if (codeFence) {
            if (line.trim().startsWith("```")) {
              flushCode();
            } else {
              codeLines.push(line);
            }
            continue;
          }

          if (line.trim().startsWith("```")) {
            flushParagraph();
            flushList();
            codeFence = line.trim().slice(3).trim() || "text";
            continue;
          }

          const tableHeaderCandidate = line.includes("|") ? line : null;
          const tableDividerCandidate = lines[i + 1] || "";
          if (
            tableHeaderCandidate &&
            /^\s*\|?[\s:-]+(?:\|[\s:-]+)+\|?\s*$/.test(tableDividerCandidate)
          ) {
            flushParagraph();
            flushList();

            const header = parseTableCells(line);
            const rows = [];
            i += 2;
            while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
              rows.push(parseTableCells(lines[i]));
              i += 1;
            }
            i -= 1;

            blocks.push(
              `<table><thead><tr>${header.map((cell) => `<th>${renderInline(cell)}</th>`).join("")}</tr></thead><tbody>${rows
                .map(
                  (row) =>
                    `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`
                )
                .join("")}</tbody></table>`
            );
            continue;
          }

          const headingMatch = line.match(/^(#{1,4})\s+(.*)$/);
          if (headingMatch) {
            flushParagraph();
            flushList();
            const originalLevel = headingMatch[1].length;
            const text = headingMatch[2].trim();

            if (originalLevel === 1) {
              pageTitle.textContent = text;
              continue;
            }

            const level = Math.min(originalLevel + 1, 5);
            blocks.push(`<h${level}>${renderInline(text)}</h${level}>`);
            continue;
          }

          const unorderedMatch = line.match(/^\s*-\s+(.*)$/);
          if (unorderedMatch) {
            flushParagraph();
            if (listType && listType !== "ul") {
              flushList();
            }
            listType = "ul";
            listItems.push(unorderedMatch[1]);
            continue;
          }

          const orderedMatch = line.match(/^\s*\d+\.\s+(.*)$/);
          if (orderedMatch) {
            flushParagraph();
            if (listType && listType !== "ol") {
              flushList();
            }
            listType = "ol";
            listItems.push(orderedMatch[1]);
            continue;
          }

          if (!line.trim()) {
            flushParagraph();
            flushList();
            continue;
          }

          if (listType) {
            flushList();
          }

          paragraph.push(line.trim());
        }

        flushParagraph();
        flushList();
        flushCode();
        return blocks.join("\n");
      };

      fetch("./project.md")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Failed to load markdown");
          }
          return response.text();
        })
        .then((markdown) => {
          content.innerHTML = buildHtml(markdown);
        })
        .catch(() => {
          content.innerHTML = "";
          const error = document.createElement("p");
          error.className = "error";
          error.textContent = "Unable to load project.md.";
          content.appendChild(error);
        });

    </script>
  </body>
</html>
